<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贵阳数智文旅平台 · 全景融合大屏</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="indicator-drill.css">
  <link rel="stylesheet" href="official-directory.css">
  <link rel="stylesheet" href="scenic-overview.css">
  <link rel="stylesheet" href="triple-screen.css">
</head>
<body class="panorama-page">
  <main id="panorama" class="panorama" aria-label="贵阳贵安文化旅游全景融合大屏">
    <header class="panorama-header">
      <div class="header-left"><span class="header-signal"></span><span>贵阳贵安 · 文旅运行全景</span><time id="wall-clock"></time></div>
      <div class="panorama-brand"><span class="brand-lines" aria-hidden="true"></span><div><h1>贵阳数智文旅平台</h1><p>GUIYANG · CULTURE & TOURISM OBSERVATORY</p></div><span class="brand-lines right" aria-hidden="true"></span></div>
      <div class="header-right"><div id="years" role="group" aria-label="统计年份"><button data-year="2026" aria-pressed="true">2026</button><button data-year="2027" aria-pressed="false">2027</button></div><a href="index.html#overview">单屏首页 ↗</a><button id="fullscreen" aria-label="全屏展示">⛶ 全屏展示</button><span class="demo-indicator">演示数据</span></div>
    </header>
    <div class="panorama-zones">
      <section class="panorama-zone culture-zone" aria-label="文化场馆与活动">
        <div class="zone-heading"><span class="zone-number">01</span><h2>文化场馆与活动</h2><span>CULTURAL VITALITY</span><i></i></div>
        <section id="culture-metrics" class="headline-metrics" aria-label="文化专题核心指标"></section>
        <div id="culture-content" class="zone-grid"></div>
      </section>
      <section class="panorama-zone overview-zone" aria-label="全域运行一张图">
        <div class="zone-heading"><span class="zone-number">02</span><h2>全域运行一张图</h2><span>REGIONAL OVERVIEW</span><i></i></div>
        <section id="overview-metrics" class="headline-metrics" aria-label="综合首页核心指标"></section>
        <div class="overview-layout">
          <div id="overview-left" class="overview-left"></div>
          <section id="map-panel" class="map-panel boundary-panel" aria-label="贵阳贵安景区热度地图">
            <div class="map-stage" aria-hidden="true"></div>
            <div class="map-toolbar">
              <h3>景区热度</h3><span id="map-scope">贵阳贵安</span><button id="map-up" hidden>← 返回全域</button>
            </div>
            <div id="unified-map" aria-label="贵阳贵安行政区及贵安双龙参考边界"></div>
            <div class="boundary-readout"></div><div class="boundary-note"></div>
            <div id="map-error" role="status" hidden></div>
          </section>
          <div id="overview-right" class="overview-right"></div>
        </div>
      </section>
      <section class="panorama-zone tourism-zone" aria-label="景区运行与服务">
        <div class="zone-heading"><span class="zone-number">03</span><h2>景区运行与服务</h2><span>SCENIC OPERATIONS</span><i></i></div>
        <section id="tourism-metrics" class="headline-metrics" aria-label="旅游专题核心指标"></section>
        <div id="tourism-content" class="zone-grid"></div>
      </section>
    </div>
    <footer class="panorama-footer"><span>● 业务数值为演示 · 官方景区与星级酒店名录为资源快照 · 地图贵安、双龙为近似参考范围</span><span>一张地图 · 同域同周期联动 <b>数据截至 <span id="as-of"></span></b></span></footer>
  </main>
  <dialog id="metric-dialog" class="rd" aria-label="资源名录与监控详情"></dialog>
  <script src="vendor/leaflet.js"></script>
  <script src="map-data.js"></script>
  <script src="official-resources.js"></script>
  <script src="indicator-data.js"></script>
  <script src="activity-ledger.js"></script>
  <script src="indicator-drill.js"></script>
  <script src="official-directory.js"></script>
  <script src="scenic-overview.js"></script>
  <script src="triple-screen.js"></script>
</body>
</html>
